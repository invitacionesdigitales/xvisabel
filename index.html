<script>
        const preloader = document.getElementById('preloader');
        const mainContent = document.getElementById('mainContent');
        const percentageEl = document.getElementById('percentage');
        const progressFill = document.getElementById('progressFill');
        
        const flowerShape = document.getElementById('flowerShape');
        const heartShape = document.getElementById('heartShape');
        const btnFlower = document.getElementById('btnFlower');
        const btnHeart = document.getElementById('btnHeart');

        let currentProgress = 0;
        let loadInterval;

        function startLoading() {
            currentProgress = 0;
            preloader.classList.remove('fade-out');
            mainContent.classList.remove('visible');

            loadInterval = setInterval(() => {
                currentProgress += Math.floor(Math.random() * 4) + 1; // Incremento aleatorio fluido
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(loadInterval);
                    
                    // Ocultar preloader y mostrar contenido
                    setTimeout(() => {
                        preloader.classList.add('fade-out');
                        mainContent.classList.add('visible');
                    }, 400);
                }
                percentageEl.textContent = currentProgress + '%';
                progressFill.style.width = currentProgress + '%';
            }, 40);
        }

        function setShape(shape) {
            if (shape === 'flower') {
                flowerShape.classList.add('active');
                heartShape.classList.remove('active');
                btnFlower.classList.add('active');
                btnHeart.classList.remove('active');
            } else {
                heartShape.classList.add('active');
                flowerShape.classList.remove('active');
                btnHeart.classList.add('active');
                btnFlower.classList.remove('active');
            }
        }

        function restartLoader() {
            clearInterval(loadInterval);
            startLoading();
        }

        // Iniciar al cargar la página
        window.onload = startLoading;
    </script>
